version: "3.9"

services:
  backend:
    build: ./backend
    container_name: clipmind-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: clipmind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipmind
      POSTGRES_PASSWORD: clipmind
      POSTGRES_DB: clipmind
    ports:
      - "5432:5432"
    volumes:
      - clipmind_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clipmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  clipmind_pgdata:
